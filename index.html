<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endevina l'equip · Cromos</title>
<style>
:root{--bg:#0b1d3a;--gold:#f5c542;--red:#d62839;--blue:#1d4ed8;--ink:#10223f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0,#17346b,var(--bg));color:#fff}
h1{font-size:2rem;margin:0 0 .5rem;text-align:center;letter-spacing:1px}
.wrap{max-width:760px;margin:0 auto;padding:1.5rem}
h2{font-size:1rem;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin:1.4rem 0 .5rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{padding:.7rem 1.1rem;border-radius:999px;border:2px solid #fff3;background:#ffffff12;color:#fff;font-size:1rem;cursor:pointer}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.go{margin-top:1.8rem;width:100%;padding:1rem;font-size:1.2rem;font-weight:800;border:0;border-radius:12px;background:var(--red);color:#fff;cursor:pointer}
#game{display:none;height:100vh;grid-template-rows:auto 1fr;grid-template-columns:1fr 1fr}
#bar{grid-column:1/3;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:.6rem;background:#0006}
.pl{padding:.3rem .8rem;border-radius:8px;background:#ffffff18;font-size:.95rem}
.pl.cur{background:var(--gold);color:var(--ink);font-weight:800}
.left,.right{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1rem;gap:.7rem;min-height:0}
.card{height:min(100%,520px);aspect-ratio:3/4;max-width:100%;border-radius:14px;padding:12px;background:linear-gradient(135deg,#fff,#e9e9e9);box-shadow:0 10px 30px #0008;display:flex;flex-direction:column;transform:rotate(-1.5deg)}
.pic{flex:1;min-height:0;border-radius:8px;border:3px solid var(--ink);background:linear-gradient(160deg,#2b6cff,#12b886 55%,#f5c542);position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pic svg{width:100%;height:100%}
.tag{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-weight:800;font-size:.7rem;padding:3px 8px;border-radius:4px;letter-spacing:1px}
.name{margin-top:8px;background:linear-gradient(90deg,var(--red),var(--blue));color:#fff;text-align:center;font-weight:900;letter-spacing:6px;padding:.5rem;border-radius:6px;font-size:1.1rem;transform:skew(-6deg)}
.opt{width:min(100%,420px);padding:1rem;font-size:1.1rem;border-radius:12px;border:2px solid #fff4;background:#ffffff14;color:#fff;cursor:pointer}
.opt:hover:not(:disabled){background:#ffffff30}
.opt.ok{background:#16a34a;border-color:#16a34a}
.opt.ko{background:#dc2626;border-color:#dc2626}
#credit{font-size:.7rem;opacity:.6;text-align:center;max-width:90%}
#q{color:var(--gold);font-weight:700;text-align:center}
#end{display:none;text-align:center;padding:3rem 1rem}
@media(max-width:700px){#game{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr;height:100vh}#bar{grid-column:1}.left,.right{padding:.4rem}.opt{padding:.6rem;font-size:1rem}}
</style>
</head>
<body>
<div class="wrap" id="menu">
  <h1>⚽ Endevina l'equip</h1>
  <h2>1. Lliga</h2><div class="row" id="lg"></div>
  <h2>2. Modalitat</h2><div class="row" id="cat"></div>
  <h2>3. Jugadors</h2><div class="row" id="np"></div>
  <button class="go" id="start">Comença!</button>
</div>

<div id="game">
  <div id="bar"></div>
  <div class="left"><div class="card"><div class="pic" id="pic"></div><div class="name" id="nm">? ? ?</div></div><div id="credit"></div></div>
  <div class="right"><div id="q"></div><div id="opts" style="display:contents"></div></div>
</div>

<div id="end"><h1 id="win"></h1><div id="fin"></div><button class="go" style="max-width:320px" onclick="location.reload()">Tornar a jugar</button></div>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),enc=encodeURIComponent;
const CATS={players:"🧑 Jugadors",coaches:"🧢 Entrenadors",stadiums:"🏟️ Estadis"};
const sel={lg:"es",cat:"players",np:1};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const j=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()});
function chips(el,items,key){
  el.innerHTML="";
  items.forEach(([v,l])=>{const b=document.createElement("button");b.className="chip"+(sel[key]==v?" on":"");b.textContent=l;
    b.onclick=()=>{sel[key]=v;chips(el,items,key)};el.append(b)});
}
chips($("#lg"),[...LEAGUES.map(l=>[l.id,l.name]),["all","Altres (totes les lligues)"]],"lg");
chips($("#cat"),Object.entries(CATS),"cat");
chips($("#np"),[1,2,3,4,5].map(n=>[n,n+(n==1?" jugador":" jugadors")]),"np");

// ---- Dades de Wikidata ----
const LC={};
async function qid(L){
  if(L.q)return L.q;
  const r=await j(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${enc(L.s)}&language=en&type=item&limit=1&format=json&origin=*`);
  return L.q=r.search[0].id;
}
const sp=async s=>(await j("https://query.wikidata.org/sparql?format=json&query="+enc(s))).results.bindings;
const lab=(v,n)=>`?${v} rdfs:label ?${n}. FILTER(lang(?${n})="en")`;
function load(L){
  return LC[L.id]||(LC[L.id]=(async()=>{
    const q=await qid(L),T=`?t wdt:P118 wd:${q}.`;
    const [pl,co,st]=await Promise.all([
      sp(`SELECT ?n ?tn ?img WHERE{${T} ?p p:P54 ?s. ?s ps:P54 ?t. FILTER NOT EXISTS{?s pq:P582 ?e} ?p wdt:P18 ?img; wdt:P569 ?b. FILTER(YEAR(?b)>=1986) FILTER NOT EXISTS{?p wdt:P570 ?d} ${lab("p","n")} ${lab("t","tn")}} LIMIT 4000`),
      sp(`SELECT ?n ?tn ?img WHERE{${T} ?t p:P286 ?s. ?s ps:P286 ?p. FILTER NOT EXISTS{?s pq:P582 ?e} ?p wdt:P18 ?img. ${lab("p","n")} ${lab("t","tn")}} LIMIT 500`),
      sp(`SELECT ?n ?tn ?img WHERE{${T} ?t wdt:P115 ?p. ?p wdt:P18 ?img. ${lab("p","n")} ${lab("t","tn")}} LIMIT 500`)
    ]);
    const conv=r=>{const seen=new Set();return r.map(b=>({n:b.n.value,t:b.tn.value,img:b.img.value})).filter(x=>!seen.has(x.n)&&seen.add(x.n))};
    const d={players:conv(pl),coaches:conv(co),stadiums:conv(st)};
    d.teams=[...new Set(d.players.map(x=>x.t))];
    if(d.teams.length<5)d.teams=[...new Set([...d.teams,...d.coaches.map(x=>x.t),...d.stadiums.map(x=>x.t)])];
    return d;
  })().catch(e=>{delete LC[L.id];throw e}));
}

// ---- Fotos (Commons, llicència lliure) ----
const CC={};
const imgUrl=u=>u.replace(/^http:/,"https:")+(u.includes("?")?"":"?width=600");
async function credit(u){
  const f=decodeURIComponent(u.split("/Special:FilePath/")[1]||"").split("?")[0];
  if(!f)return"";
  if(f in CC)return CC[f];
  try{
    const m=await j(`https://commons.wikimedia.org/w/api.php?action=query&titles=${enc("File:"+f)}&prop=imageinfo&iiprop=extmetadata&format=json&origin=*`);
    const e=Object.values(m.query.pages)[0].imageinfo[0].extmetadata;
    const a=(e.Artist&&e.Artist.value||"").replace(/<[^>]+>/g,"").trim();
    return CC[f]="Foto: "+(a||"autor desconegut")+" · "+(e.LicenseShortName?e.LicenseShortName.value:"")+" · Wikimedia Commons";
  }catch(x){return CC[f]=""}
}

// ---- Joc ----
let S;
$("#start").onclick=async()=>{
  const b=$("#start");b.disabled=true;b.textContent="Carregant dades de Wikidata…";
  try{
    const ls=sel.lg=="all"?LEAGUES:[LEAGUES.find(l=>l.id==sel.lg)];
    const rs=(await Promise.allSettled(ls.map(load))).filter(r=>r.status=="fulfilled").map(r=>r.value);
    if(!rs.length)throw 0;
    const pool=rs.flatMap(d=>d[sel.cat]),teams=[...new Set(rs.flatMap(d=>d.teams))];
    if(!pool.length||teams.length<5){alert("No he trobat prou dades d'aquesta combinació a Wikidata. Prova una altra lliga o modalitat.");return}
    S={pool,teams,deck:[],scores:Array(+sel.np).fill(0),turn:0,locked:false};
    $("#menu").style.display="none";$("#game").style.display="grid";next();
  }catch(e){alert("No s'han pogut carregar les dades (Wikidata no respon o no hi ha connexió). Torna-ho a provar.")}
  finally{b.disabled=false;b.textContent="Comença!"}
};
function silhouette(){return '<svg viewBox="0 0 100 130"><circle cx="50" cy="42" r="20" fill="#fff8"/><path d="M12 130c0-30 17-48 38-48s38 18 38 48z" fill="#fff8"/></svg>'}
function bar(){
  $("#bar").innerHTML=S.scores.map((s,i)=>`<div class="pl${i==S.turn?" cur":""}">${S.scores.length>1?"Jugador "+(i+1):"Punts"}: ${s}</div>`).join("");
}
function next(){
  if(!S.deck.length)S.deck=shuffle(S.pool);
  const it=S.cur=S.deck.pop();S.locked=false;
  const tag=sel.cat=="players"?"JUGADOR":sel.cat=="coaches"?"ENTRENADOR":"ESTADI";
  $("#pic").innerHTML=`<span class="tag">${tag}</span>`+silhouette();$("#credit").textContent="";
  const im=new Image();im.alt="";
  im.onload=()=>{if(S.cur!==it)return;$("#pic").innerHTML=`<span class="tag">${tag}</span>`;$("#pic").append(im);credit(it.img).then(c=>{if(S.cur===it)$("#credit").textContent=c})};
  im.src=imgUrl(it.img);
  $("#q").textContent=S.scores.length>1?`Torn del jugador ${S.turn+1} — de quin equip és?`:"De quin equip és?";
  const opts=shuffle([it.t,...shuffle(S.teams.filter(t=>t!=it.t)).slice(0,4)]);
  $("#opts").innerHTML="";
  opts.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(b,t);$("#opts").append(b)});
  bar();
}
function answer(b,t){
  if(S.locked)return;S.locked=true;
  const ok=t==S.cur.t;
  document.querySelectorAll(".opt").forEach(o=>{if(o.textContent==S.cur.t)o.classList.add("ok")});
  if(!ok)b.classList.add("ko");else S.scores[S.turn]+=100;
  $("#nm").textContent=S.cur.n.toUpperCase();$("#nm").style.letterSpacing="1px";
  bar();
  setTimeout(()=>{
    $("#nm").textContent="? ? ?";$("#nm").style.letterSpacing="6px";
    if(S.scores[S.turn]>=1000)return finish();
    S.turn=(S.turn+1)%S.scores.length;next();
  },1600);
}
function finish(){
  $("#game").style.display="none";$("#end").style.display="block";
  $("#win").textContent=S.scores.length>1?`🏆 Guanya el jugador ${S.turn+1}!`:"🏆 Has arribat a 1000 punts!";
  $("#fin").innerHTML=S.scores.map((s,i)=>`<p>${S.scores.length>1?"Jugador "+(i+1):"Punts"}: <b>${s}</b></p>`).join("");
}
</script>
</body>
</html>
